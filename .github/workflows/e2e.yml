name: Storefront quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm install --no-save @playwright/test @axe-core/playwright
      - run: npx playwright install --with-deps chromium
      - run: npm run test:a11y
      - run: npm run test:e2e -- --grep-invert accessibility
